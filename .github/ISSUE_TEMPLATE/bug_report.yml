name: Bug report
description: 报告一个可以复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现的信息，尤其是**厂商 + 模型名**，很多问题只出现在特定厂商。
  - type: dropdown
    id: provider
    attributes:
      label: 使用的厂商
      options:
        - DeepSeek
        - 通义千问
        - Kimi
        - 智谱 GLM
        - Ollama
        - 其他 / 自定义
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 模型名
      placeholder: 例如 deepseek-chat / qwen2.5:7b
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 新建会话，选择「编程助手」预设
        2. 发送一条长问题
        3. 中途关闭网络
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 如果是报错，请贴出浏览器 Console 或后端 traceback
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 运行方式
      placeholder: 本地 npm run dev / Docker Compose
    validations:
      required: true
